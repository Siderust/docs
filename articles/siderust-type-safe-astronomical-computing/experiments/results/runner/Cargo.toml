[package]
name = "siderust-paper-revalidation"
version = "0.1.0"
default-run = "siderust-paper-revalidation"
edition = "2021"
publish = false

# The article's examples use the published Siderust v0.18.1 crate.
[dependencies]
siderust = "=0.18.1"
qtty = "=0.8.6"
tempoch = "=0.11.2"
chrono = "=0.4.45"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = false
incremental = false
overflow-checks = false
